[SYSTEM]
; Additional .SYS files to load at startup (comma-separated)
; Hold SHIFT during boot to enter Safe Mode (skips loading these)
LOAD=MINITEL.SYS

[DISPLAY]
; Default screen resolution (optional)
; WIDTH=80
; HEIGHT=25

[NETWORK]
; Default network settings (optional)
; HOSTNAME=MDOS-PC

[STARTUP]
; Program to run automatically at startup (optional)
; AUTOEXEC=STARTUP.PRG